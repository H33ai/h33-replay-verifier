[package]
name = "h33-replay-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Independent offline verifier for SCIF replay bundles. The same Rust 10-check protocol that the H33 backend ships, plus signed-transcript wrapping via ML-DSA-65. No network, no daemon, no H33 dependency."
readme = "../../README.md"

[[bin]]
name = "h33-replay-verify"
path = "src/main.rs"

[lib]
name = "h33_replay_verify"
path = "src/lib.rs"

[dependencies]
h33-replay-verify-core = { path = "../h33-replay-verify-core" }

# CLI argument parsing.
clap = { version = "4.5", features = ["derive"] }

# Wire types + base64/hex/sha3 for the signed-transcript envelope.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"

# ML-DSA-65 (FIPS 204) for signed-transcript verification. Same crate the
# scif-backend signer uses, so signatures verify bit-for-bit either side.
pqcrypto-mldsa = "0.1"
pqcrypto-traits = "0.3"

[dev-dependencies]
tempfile = "3.10"
