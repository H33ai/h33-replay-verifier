[package]
name = "h33-replay-verify-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "H33 replay-bundle verifier — pure-Rust core (WASM-friendly). Canonical source of the 10-check protocol that drives the CLI, the browser playground, and any third-party verifier."
readme = "../../README.md"
keywords = ["replay", "verification", "h33", "post-quantum"]
categories = ["cryptography"]

[lib]
name = "h33_replay_verify_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
hex = "0.4"
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# Place-first 2026-07-06 · h33-reference::LifecycleEvent now has a home in
# Governance Replay. Adapter projects a bundle GovernanceEvent onto the
# platform's typed LifecycleEvent so any downstream consumer that expects
# the platform primitive can be handed one. Wire format unchanged.
h33-reference = { path = "../../../h33-dmp/crates/h33-reference" }
h33-envelope = { path = "../../../h33-dmp/crates/h33-envelope" }
